name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Building only reads the repository. Without this the token gets the repository's default
# permissions, which can include write access a pull request's build has no business having.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build Pointsman.sln -c Release
